[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops"
version = "0.1.0"
description = "PyTorch training operations, explicit VJPs, implementation dispatch, and optimized optimizers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["torch>=2.13"]

[project.optional-dependencies]
fla = ["flash-linear-attention>=0.5.2"]
liger = ["liger-kernel==0.8.1"]
# scattermoe publishes no PyPI distribution; 0.3.0 is the version at this commit.
scattermoe = [
  "scattermoe @ git+https://github.com/shawntan/scattermoe.git@47b5e1502e5a10e82c8e5945d761b877849871e7",
]
# TileLang backs fla's gated-delta-rule backward on Hopper (fla enables it by
# default on sm90 with Triton >= 3.4.0).
tilelang = ["tilelang"]
providers = ["mlops[fla,liger,scattermoe,tilelang]"]
dev = ["pytest", "ruff"]
# GLM KDA uses private FLA kernel interfaces; retain the tested versions.
glm = ["flash-linear-attention==0.5.2", "fla-core==0.5.2", "tilelang==0.1.14"]
# MoonEP is installed separately by scripts/setup_expert_parallel.sh: its
# upstream metadata pins an older Cutlass DSL than the supported Quack stack.
ep-quack = [
  "triton==3.7.1",
  "quack-kernels @ git+https://github.com/Dao-AILab/quack.git@35266c3298f0e9bf6d5f46c30aace2eaeae517e3",
  "sonic-moe @ git+https://github.com/Dao-AILab/sonic-moe.git@7396f3e604827d8186c2e16e64b28ee33d3defd0",
  "nvidia-cutlass-dsl==4.7.1",
]
ep-te = [
  "triton==3.7.1",
  "nvidia-cutlass-dsl==4.7.1",
  "transformer_engine[pytorch] @ git+https://github.com/NVIDIA/TransformerEngine.git@110791f2dfa006335187943414c4fc9e1b03ef0f",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlops*"]

[tool.setuptools.package-data]
"mlops.glm" = ["provenance.json", "kernels/*LICENSE"]

[tool.pytest.ini_options]
markers = [
  "gpu: requires a CUDA device",
  "expert_parallel: opt-in Hopper/NCCL checks; enable with --run-expert-parallel",
]

[tool.ruff]
extend-exclude = ["tests/glm/references"]
line-length = 88
target-version = "py312"
