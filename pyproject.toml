[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops"
version = "0.1.0"
description = "PyTorch training operations, explicit VJPs, implementation dispatch, and optimized optimizers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["torch>=2.13"]

[project.optional-dependencies]
# FA3 is published only on the PyTorch index (its PyPI release is an empty,
# yanked placeholder), one build per CUDA major under one file name. The cu130
# build links libcudart.so.13, so it loads beside any CUDA 13 torch, cu132
# included; mlops activates it at dispatch time, and only on Hopper.
fa3 = [
  "flash-attn-3 @ https://download.pytorch.org/whl/cu130/flash_attn_3-3.0.0-cp39-abi3-manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "flash-attn-3 @ https://download.pytorch.org/whl/cu130/flash_attn_3-3.0.0-cp39-abi3-manylinux_2_34_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# cuDNN Frontend's CuTe DSL kernels: its DeepSeek-sparse-attention backward is
# the Hopper sparse latent attention provider's backward, and its SM90
# indexer is the preferred pooled-top-k scorer/selector. The pin matches the
# Transformer Engine step's; the DSL it needs comes with Quack.
cudnn = ["nvidia-cudnn-frontend==1.30.0"]
# KDA calls tested private FLA kernel interfaces.
fla = ["flash-linear-attention==0.5.2", "fla-core==0.5.2"]
# TileLang backs fla's gated-delta-rule backward on Hopper (fla enables it by
# default on sm90 with Triton >= 3.4.0).
tilelang = ["tilelang==0.1.15"]
# mHC Sinkhorn and fused post kernels; dispatch is restricted to SM90/SM100.
tilekernels = [
  "tile-kernels @ git+https://github.com/deepseek-ai/TileKernels.git@c1cf914a82e6901c679445f872051ce44ac2cc63",
  "mlops[tilelang]",
]
# Quack's GEMMs are CUTLASS CuTe DSL kernels (Linux wheels only); SonicMoE's
# MoE kernels build on them. Both run on Hopper and Blackwell GPUs.
quack = [
  "quack-kernels @ git+https://github.com/Dao-AILab/quack.git@35266c3298f0e9bf6d5f46c30aace2eaeae517e3 ; sys_platform == 'linux'",
  "nvidia-cutlass-dsl==4.7.1 ; sys_platform == 'linux'",
]
sonicmoe = [
  "mlops[quack]",
  "sonic-moe @ git+https://github.com/Dao-AILab/sonic-moe.git@7396f3e604827d8186c2e16e64b28ee33d3defd0 ; sys_platform == 'linux'",
]
# DeepGEMM is built by scripts/setup_deepgemm.sh against this Torch/CUDA,
# with pinned source/submodules and C++20/elfutils build checks. setup.sh
# includes it by default; --no-deepgemm opts out.
# cuLA is built separately by scripts/setup_cula_sm90.sh: upstream metadata
# constrains CuTe <4.7 for its SM100 private APIs, while our SM90 adapter is
# validated with the public CuTe APIs in 4.7.1. setup.sh adds it on Hopper.
providers = ["mlops[cudnn,fa3,fla,quack,sonicmoe,tilelang,tilekernels]"]
dev = ["pytest", "ruff"]
# MoonEP is installed separately by scripts/setup_expert_parallel.sh: its
# upstream metadata pins an older Cutlass DSL than the supported Quack stack.
ep-quack = ["mlops[sonicmoe]", "triton==3.7.1"]
ep-te = [
  "triton==3.7.1",
  "nvidia-cutlass-dsl==4.7.1",
  "transformer_engine[pytorch] @ git+https://github.com/NVIDIA/TransformerEngine.git@110791f2dfa006335187943414c4fc9e1b03ef0f",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlops*"]

[tool.setuptools.package-data]
"mlops.kernels.kda" = ["provenance.json", "*LICENSE"]
"mlops.kernels.sparse_mla" = ["provenance.json", "*LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA device",
  "expert_parallel: opt-in Hopper/NCCL checks; enable with --run-expert-parallel",
]

[tool.ruff]
extend-exclude = ["tests/operations/references"]
line-length = 88
target-version = "py312"
